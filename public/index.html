<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP TRACKER // RANKED SURVEILLANCE</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <div class="container">
    <h1>LP TRACKER</h1>

    <!-- Sidebar: Player Cards -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button id="refresh-all-btn" onclick="refreshAllPlayers()">Refresh All</button>
        <div id="last-updated" class="last-updated">Last updated: --</div>
      </div>
      <div id="player-cards" class="player-cards">
        <!-- Cards dynamically added -->
      </div>
    </div>

    <!-- Main: LP History Chart -->
    <div class="chart-section">
      <h2>// LIFTED F-250</h2>
      <div id="chart-container">
        <canvas id="lp-chart"></canvas>
      </div>
      <div class="timeline-controls">
        <input type="range" id="timeline-slider" min="0" max="100" value="100">
        <div class="timeline-labels">
          <span id="timeline-start">--</span>
          <span id="timeline-end">--</span>
        </div>
      </div>
      <p class="chart-note">// DRAG CHART OR USE SLIDER TO SCROLL TIMELINE</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
  <script src="player-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
